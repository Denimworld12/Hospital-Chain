# MedChain node configuration. Every node runs the same image; this file alone
# decides which hospital it is, who its neighbours are, and which data it reads.
node_id: hospital-a
display_name: Hospital A
port: 8001
advertise_url: http://hospital-a:8001

# Chain topology A - B - C. `chain` is the node order 1..N for the ADMM engines:
# odd positions are the HEAD group, even the TAIL group; neighbours must be exactly
# my chain neighbours.
chain: [hospital-a, hospital-b, hospital-c]
neighbours:
  - id: hospital-b
    url: http://hospital-b:8002

# Pre-shared secret every peer (and the dashboard relay) sends in the
# X-MedChain-Secret header on /update, /snapshot and /round/*. Same value on all nodes.
shared_secret: medchain-demo-secret

# Only this hospital's own slice is mounted into its container.
data_slice: /data/hospital-a.csv

# Training engine:
#   qgadmm    Q-GADMM (Elgabli et al., IEEE Trans. Commun. 2021): stochastic b-bit
#             quantized differences, head/tail group ADMM on the chain
#   gadmm_fp  full-precision GADMM: same algorithm, quantization skipped (raw float32 deltas)
#   gossip    the naive gossip baseline: plain neighbour weight averaging, float64
#             weights (ignores rho, bits and the ADMM settings below)
engine: qgadmm

# ADMM settings (qgadmm / gadmm_fp)
rho: 24.0             # penalty; the {5, 15, 24, 50} sweep is in experiments/compare_engines.py
alpha: 1.0            # dual step scale (1.0 for logistic regression; 0.01 reserved for DNNs)
bits: 2               # qgadmm bits per coordinate: 2, 4 or 8
local_epochs: 50      # full-batch Adam steps per primal step (E=5 never reaches consensus here)
lr: 0.01              # Adam learning rate
epsilon: 0.001        # consensus: max edge residual below this for 3 consecutive rounds
checkpoint_every: 5   # rounds between checkpoints to /checkpoints (a docker volume)
seed: 42              # + chain position: this node's quantizer / shuffling RNG

training:
  rounds: 200         # round limit (the ADMM engines stop earlier once consensus is reached)
  local_epochs: 2     # gossip baseline only (scikit-learn SGD epochs per round)
  learning_rate: 0.005  # gossip baseline only
  test_fraction: 0.25
  seed: 7

timing:
  heartbeat_interval_s: 5
  round_timeout_s: 6
  round_pause_s: 0.2
