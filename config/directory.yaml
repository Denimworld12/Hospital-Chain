# MedChain directory service (python -m directory). It decides chain membership -
# where a new hospital goes, who bridges when one leaves - and nothing else: it never
# sees model weights and never runs or influences training. Its store is its own
# SQLite file, separate from the Postgres the dashboard reads.
port: 8100
db_path: /data/directory.sqlite
# signs every membership document; nodes verify with directory/signing.pub
signing_key: /pki/directory/signing.key
# who may register (id + SHA-256 of its credential), in placement order; re-read on each request
hospitals_file: /pki/directory/hospitals.yaml
# a change takes effect this many rounds after the furthest member's current round
margin_rounds: 3
tls:
  cert: /pki/directory/tls.crt
  key: /pki/directory/tls.key
  ca: /pki/ca.crt
# the hub's admin token, for the dashboard's admin page (join codes): made on first start; the
# dashboard reads the same file
admin_token_file: /hub/admin_token
# Join codes (directory/enroll.py): a hospital on another laptop enrolls with a one-time code
# from the dashboard instead of a kit. Its own keys stay on its laptop; the directory issues
# its certificate with the network CA, so it needs the CA key.
enrollment:
  ca_cert: /pki/ca.crt
  ca_key: /pki/ca.key
  observer_cert: /pki/observer/tls.crt  # enrolled hospitals pin the observer's key
  observer_port: 8200
  slices_dir: /slices                   # the data slices a code hands out
  node_template: /templates/node.yaml   # its engine settings are every hospital's
  code_ttl_minutes: 30
